name: Deploy via VPN

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install OpenVPN
      - name: Install OpenVPN
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openvpn curl

      # Create VPN config file
      - name: Setup VPN config
        run: |
          echo "${{ secrets.OVPN_CONFIG }}" > vpn.ovpn

      # Setup auth (if required)
      - name: Setup VPN auth
        env:
          VPN_USER: ${{ secrets.OVPN_USERNAME }}
          VPN_PASS: ${{ secrets.OVPN_PASSWORD }}
        run: |
          if [ -n "$VPN_USER" ]; then
            echo -e "$VPN_USER\n$VPN_PASS" > auth.txt
            echo "auth-user-pass auth.txt" >> vpn.ovpn
          fi

      # Start VPN
      - name: Start VPN
        run: |
          sudo openvpn --config vpn.ovpn --daemon --log vpn.log --verb 3

      # Wait for VPN connection
      - name: Wait for VPN
        run: |
          echo "Waiting for VPN connection..."
          for i in {1..20}; do
            if grep -q "Initialization Sequence Completed" vpn.log; then
              echo "VPN Connected ✅"
              break
            fi
            sleep 2
          done

          if ! grep -q "Initialization Sequence Completed" vpn.log; then
            echo "VPN FAILED ❌"
            cat vpn.log
            exit 1
          fi

      # Verify connection (IMPORTANT)
      - name: Verify VPN
        run: |
          echo "Public IP:"
          curl -s ifconfig.me
          echo ""

      # Test private EC2 access
      - name: Test Private EC2
        run: |
          ping -c 3 <PRIVATE_EC2_IP>
          curl http://<PRIVATE_EC2_IP>:<PORT> || true

      # SSH into private EC2 (example deployment)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: <PRIVATE_EC2_IP>
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/app
            git pull
            npm install
            pm2 restart app

      # Cleanup
      - name: Stop VPN
        if: always()
        run: |
          sudo killall openvpn || true
