name: Deploy via SSM (OIDC)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: i-0bbdf1383d9783465   # 👈 your EC2 instance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate using OIDC (no AWS keys)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::848747536871:role/oidc_ci_cd
          aws-region: ${{ env.AWS_REGION }}

      # Optional: Debug identity
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Send command to EC2 via SSM
      - name: Deploy to Private EC2 via SSM
        run: |
          echo "Starting deployment..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy via GitHub Actions" \
            --parameters 'commands=[
              "echo Connected to EC2",
              "cd /home/ubuntu/app || exit 1",
              "git pull",
              "npm install",
              "pm2 restart app || pm2 start app"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          echo "Waiting for command to complete..."

          # Wait loop
          for i in {1..15}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful ✅"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment failed ❌"
              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 3
          done

          echo "Fetching output..."

          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
