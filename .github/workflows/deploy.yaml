name: Deploy via VPN

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install OpenVPN
      - name: Install OpenVPN
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openvpn curl

      # Create VPN config
      - name: Setup VPN config
        run: |
          echo "${{ secrets.OVPN_CONFIG }}" > vpn.ovpn

      # Setup auth (optional)
      - name: Setup VPN auth
        env:
          VPN_USER: ${{ secrets.OVPN_USERNAME }}
          VPN_PASS: ${{ secrets.OVPN_PASSWORD }}
        run: |
          if [ -n "$VPN_USER" ]; then
            echo -e "$VPN_USER\n$VPN_PASS" > auth.txt
            echo "auth-user-pass auth.txt" >> vpn.ovpn
          fi

      # Start VPN (log to /tmp to avoid permission issues)
      - name: Start VPN
        run: |
          sudo openvpn --config vpn.ovpn --daemon --log /tmp/vpn.log --verb 3

      # Wait for VPN connection
      - name: Wait for VPN
        run: |
          echo "Waiting for VPN connection..."
          for i in {1..20}; do
            if grep -q "Initialization Sequence Completed" /tmp/vpn.log; then
              echo "VPN Connected ✅"
              break
            fi
            sleep 2
          done

          if ! grep -q "Initialization Sequence Completed" /tmp/vpn.log; then
            echo "VPN FAILED ❌"
            echo "===== VPN LOG ====="
            cat /tmp/vpn.log
            exit 1
          fi

      # Verify VPN (IP should change)
      - name: Verify VPN
        run: |
          echo "Public IP:"
          curl -s ifconfig.me
          echo ""

      # Test connectivity to private EC2
      - name: Test Private EC2
        run: |
          echo "Testing connectivity..."
          ping -c 3 <PRIVATE_EC2_IP> || true

      # Deploy via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: <PRIVATE_EC2_IP>
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/app || exit 1
            git pull
            npm install
            pm2 restart app || pm2 start app

      # Cleanup
      - name: Stop VPN
        if: always()
        run: |
          sudo killall openvpn || true
