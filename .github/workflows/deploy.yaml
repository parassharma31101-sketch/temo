name: VPN Pipeline

on:
  push:
    branches:
      - main

jobs:
  run-with-vpn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install dependencies
      - name: Install OpenVPN
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openvpn curl

      # Write OVPN config from secret
      - name: Setup VPN config
        run: |
          echo "${{ secrets.OVPN_CONFIG }}" > vpn.ovpn

      # Setup auth safely (no YAML-level if)
      - name: Setup VPN auth (optional)
        env:
          VPN_USER: ${{ secrets.OVPN_USERNAME }}
          VPN_PASS: ${{ secrets.OVPN_PASSWORD }}
        run: |
          if [ -n "$VPN_USER" ]; then
            echo -e "$VPN_USER\n$VPN_PASS" > auth.txt

            if ! grep -q "auth-user-pass" vpn.ovpn; then
              echo "auth-user-pass auth.txt" >> vpn.ovpn
            fi
          fi

      # Start VPN
      - name: Start VPN
        run: |
          sudo openvpn --config vpn.ovpn --daemon --log vpn.log

      # Wait until VPN connects (no fixed sleep)
      - name: Wait for VPN connection
        run: |
          for i in {1..25}; do
            if grep -q "Initialization Sequence Completed" vpn.log; then
              echo "VPN Connected ✅"
              break
            fi
            echo "Waiting for VPN..."
            sleep 2
          done

          if ! grep -q "Initialization Sequence Completed" vpn.log; then
            echo "VPN connection failed ❌"
            echo "===== VPN LOG ====="
            cat vpn.log
            exit 1
          fi

      # Verify IP (should be VPN IP)
      - name: Verify VPN IP
        run: |
          echo "Public IP:"
          curl -s ifconfig.me
          echo ""

      # Test private resource
      - name: Test private access
        run: |
          curl -v --max-time 15 http://your-private-server || exit 1

      # Your actual job
      - name: Run your tasks
        run: |
          echo "Running tasks inside VPN..."
          # Example:
          # npm install
          # npm run build
          # curl internal API
          # connect to DB

      # Always cleanup
      - name: Stop VPN
        if: always()
        run: |
          sudo killall openvpn || true
